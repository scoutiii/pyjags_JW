name: Build wheels

on:
  push:
    branches: [ main, master, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, dev]

jobs:
  linux:
    if: false  # temporarily disabled while focusing on Windows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel==3.2.1
      - name: Build wheels
        env:
          CIBW_BUILD: cp311-manylinux_* cp312-manylinux_* cp313-manylinux_*
          CIBW_ARCHS_LINUX: x86_64 aarch64
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: wheelhouse/*.whl
          if-no-files-found: error

  macos:
    if: false  # temporarily disabled while focusing on Windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            artifact: wheels-macos-arm64
          - os: macos-15-intel
            arch: x86_64
            artifact: wheels-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel==3.2.1
      - name: Build wheels (macOS ${{ matrix.arch }})
        env:
          CIBW_BUILD: cp311-macosx_* cp312-macosx_* cp313-macosx_*
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel==3.2.1
      - name: Build wheels (Windows x64)
        env:
          CIBW_BUILD: cp311-win_amd64 cp312-win_amd64 cp313-win_amd64
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl
          if-no-files-found: error
